    <circle cx="55" cy="55" r="50" fill="#047857" stroke="#34d399" stroke-width="2.5" filter="url(#hlGlow)" />
    <!-- Modern Telephone Handset -->
    <path d="M 42 42 C 42 58 52 68 68 68 C 72 68 74 65 73 62 L 70 54 C 69 52 66 52 65 54 L 62 56 C 58 54 56 52 54 48 L 56 45 C 58 44 58 41 56 40 L 48 37 C 45 36 42 39 42 42 Z"
          fill="#ffffff" />
    <!-- Audio Wave Lines -->
    <path d="M 76 38 C 82 44 82 66 76 72" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />
    <path d="M 83 31 C 92 40 92 70 83 79" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
