<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#031f17" />
    </linearGradient>
    <filter id="hlGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="240" rx="20" fill="url(#hlBg)" stroke="#10b981" stroke-width="1.2" />

  <!-- Background decorative wave circles -->
  <circle cx="680" cy="120" r="180" fill="none" stroke="#34d399" stroke-opacity="0.06" stroke-width="2" />
  <circle cx="680" cy="120" r="140" fill="none" stroke="#34d399" stroke-opacity="0.09" stroke-width="2" />
  <circle cx="680" cy="120" r="95" fill="none" stroke="#34d399" stroke-opacity="0.14" stroke-width="2" />

  <!-- Right Side Visual Icon (Headset & Audio Waves) -->
