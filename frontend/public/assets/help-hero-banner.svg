<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#006A4E" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Subtle Cadastral Grid Pattern -->
    <pattern id="cadastralGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#34d399" stroke-width="0.7" stroke-opacity="0.12" />
      <circle cx="30" cy="30" r="1.5" fill="#a7f3d0" fill-opacity="0.15" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="24" fill="url(#cadastralGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="160" fill="#059669" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="1050" cy="220" r="180" fill="#10b981" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="850" cy="80" r="120" fill="#fbbf24" opacity="0.18" filter="url(#softGlow)" />

  <!-- Right Side: Graphic Feature Illustration (Shield & Trust Emblem) -->
  <g transform="translate(880, 50)" filter="url(#dropShadow)">
    <!-- Decorative Outer Ring -->
    <circle cx="160" cy="160" r="150" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="160" cy="160" r="125" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="160" cy="160" r="100" fill="url(#cardGrad)" stroke="#6ee7b7" stroke-opacity="0.4" stroke-width="2" />

    <!-- Civic Shield -->
    <path d="M 160 85 L 215 110 V 165 C 215 210 190 235 160 245 C 130 235 105 210 105 165 V 110 Z"
          fill="url(#shieldGrad)" stroke="#a7f3d0" stroke-width="2.5" />

    <!-- Red Circle Accent (National Flag Motif) -->
    <circle cx="160" cy="155" r="28" fill="#F42A41" stroke="#ffffff" stroke-width="2.5" />
    <!-- White Checkmark -->
    <path d="M 148 156 L 156 164 L 173 146" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Golden Star -->
    <polygon points="160,98 163,105 170,105 165,110 167,117 160,113 153,117 155,110 150,105 157,105" fill="url(#goldGrad)" />

    <!-- Floating Security Nodes -->
    <g transform="translate(45, 110)">
      <circle cx="20" cy="20" r="18" fill="#047857" stroke="#34d399" stroke-width="1.5" />
      <path d="M 14 20 L 18 24 L 26 16" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <g transform="translate(235, 190)">
      <circle cx="20" cy="20" r="18" fill="#064e3b" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="20" cy="20" r="8" fill="#fbbf24" opacity="0.8" />
    </g>

    <g transform="translate(60, 220)">
      <circle cx="18" cy="18" r="16" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5" />
      <path d="M 12 18 H 24 M 18 12 V 24" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Left Side Subtle Decorative Wave Contour Lines (No Text) -->
  <path d="M -50 280 C 150 200, 350 360, 600 290 C 750 240, 850 320, 1000 270"
        fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="2" />
  <path d="M -50 340 C 200 260, 400 400, 650 330 C 800 280, 950 360, 1100 310"
        fill="none" stroke="#6ee7b7" stroke-opacity="0.08" stroke-width="1.5" />
</svg>