<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="feeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="feeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlowFee">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <rect width="800" height="240" rx="20" fill="url(#feeBg)" stroke="#f59e0b" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <circle cx="150" cy="80" r="110" fill="#d97706" opacity="0.2" filter="url(#softGlowFee)" />
  <circle cx="680" cy="140" r="120" fill="#10b981" opacity="0.25" filter="url(#softGlowFee)" />

  <!-- Right Side Visual Graphic: Official Circular Seal & Stamp (Without conflicting text) -->
  <g transform="translate(600, 35)">
    <circle cx="85" cy="85" r="75" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="85" cy="85" r="64" fill="#047857" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="85" cy="85" r="50" fill="none" stroke="#fde68a" stroke-width="1" stroke-opacity="0.5" />
    <!-- Center Seal Icon: Scales of Justice & Star -->
    <path d="M 85 58 V 105 M 65 72 H 105 M 65 72 L 58 92 H 72 Z M 105 72 L 98 92 H 112 Z M 75 105 H 95"
          fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="85,48 87,53 92,53 88,56 90,61 85,58 80,61 82,56 78,53 83,53" fill="url(#feeGold)" />
  </g>
</svg>