services:
  api:
    build: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/bhumishield.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      REGISTRAR_ED25519_SEED_HEX: ${REGISTRAR_ED25519_SEED_HEX:?Set a private 64-character signing seed}
      PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:?Set the public HTTPS frontend origin}
    volumes:
      - land-data:/data
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  land-data:
