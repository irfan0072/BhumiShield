version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bhumishield_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumishield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumishield_demo_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bhumishield}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumishield -d bhumishield"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhumishield_api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bhumishield:bhumishield_demo_2026@db:5432/bhumishield}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhumishield_web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
